info:
  name: "[Auth] Save question"
  type: http
  seq: 7

http:
  method: POST
  url: "{{API_ENDPOINT}}/questions/1/save"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
