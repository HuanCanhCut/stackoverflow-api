info:
  name: "[Auth] Update question"
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{API_ENDPOINT}}/questions/1"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "title": "Tiêu đề câu hỏi đã cập nhật",
        "body": "Nội dung câu hỏi đã được chỉnh sửa lại chi tiết hơn.",
        "tags": [
          {
            "name": "nestjs"
          },
          {
            "name": "typescript"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
