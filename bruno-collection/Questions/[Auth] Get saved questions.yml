info:
  name: "[Auth] Get saved questions"
  type: http
  seq: 9

http:
  method: GET
  url: "{{API_ENDPOINT}}/questions/saved?page=1&per_page=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
