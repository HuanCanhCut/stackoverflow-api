info:
  name: "[Auth] Create notification"
  type: http
  seq: 2

http:
  method: POST
  url: "{{API_ENDPOINT}}/notifications"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "content": "Có người vừa trả lời câu hỏi của bạn",
        "metadata": {
          "question_id": 1
        },
        "recipient_ids": [2]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
