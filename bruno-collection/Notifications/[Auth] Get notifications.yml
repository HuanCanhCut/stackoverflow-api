info:
  name: "[Auth] Get notifications"
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_ENDPOINT}}/notifications?page=1&per_page=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
