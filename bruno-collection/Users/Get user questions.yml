info:
  name: Get user questions
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_ENDPOINT}}/users/1/questions?page=1&per_page=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
