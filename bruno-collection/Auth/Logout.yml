info:
  name: Logout
  type: http
  seq: 2

http:
  method: POST
  url: "{{API_ENDPOINT}}/auth/logout"
  body:
    type: form-urlencoded
    data:
      - name: access_token
        value: ""
      - name: refresh_token
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
