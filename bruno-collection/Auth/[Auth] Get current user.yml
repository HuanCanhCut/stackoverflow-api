info:
  name: "[Auth] Get current user"
  type: http
  seq: 7

http:
  method: GET
  url: "{{API_ENDPOINT}}/auth/me"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
