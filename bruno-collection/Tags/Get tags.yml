info:
  name: Get tags
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_ENDPOINT}}/tags?page=1&per_page=50"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
