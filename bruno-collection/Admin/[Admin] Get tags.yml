info:
  name: "[Admin] Get tags"
  type: http
  seq: 12

http:
  method: GET
  url: "{{API_ENDPOINT}}/admin/tags?page=1&per_page=20&search=&sort=usage"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
