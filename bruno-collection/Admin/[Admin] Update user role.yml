info:
  name: "[Admin] Update user role"
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{API_ENDPOINT}}/admin/users/2/role"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
        {
          "role": "admin"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
