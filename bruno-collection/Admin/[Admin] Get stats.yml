info:
  name: "[Admin] Get stats"
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_ENDPOINT}}/admin/stats?days=30"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
