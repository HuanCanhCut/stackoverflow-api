info:
  name: "[Admin] Get users"
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_ENDPOINT}}/admin/users?page=1&per_page=20&search=&role=user&status=active&sort=newest"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
